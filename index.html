<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<title>Rock Paper Scissors</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#20231f;--muted:#7b7e76;--paper:#f7f4ee;--line:#e7e3da;--green:#31674b;--mint:#dceadf;--orange:#f1a465;--card:#fffefa}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:34px 22px 28px}.shell{width:min(100%,960px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.04em}.brand-mark{width:30px;height:30px;background:var(--green);color:white;border-radius:9px;display:grid;place-items:center;font-size:16px}.bestof{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hero{text-align:center;padding:43px 0 27px}.eyebrow{font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.18em;color:var(--green);font-size:10px;font-weight:500}.hero h1{font-size:clamp(38px,7vw,62px);line-height:.98;letter-spacing:-.065em;margin:14px 0 12px;font-weight:700}.hero p{color:var(--muted);font-size:14px;margin:0}.scoreboard{display:flex;justify-content:center;align-items:center;gap:clamp(30px,10vw,115px);margin:5px auto 30px}.score{text-align:center;min-width:78px}.score .label{font-family:'DM Mono',monospace;color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.score .num{font-size:38px;letter-spacing:-.06em;font-weight:700;line-height:1.2}.score .num.bump{animation:bump .32s ease}.divider{height:39px;border-left:1px solid var(--line)}@keyframes bump{50%{transform:scale(1.25);color:var(--green)}}.arena{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px 30px 27px;box-shadow:0 8px 28px #55483209}.arena-label{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--muted)}.dot{width:6px;height:6px;background:#a9b9a9;border-radius:50%}.versus{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;max-width:610px;margin:25px auto 20px}.player{text-align:center}.player-name{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--muted);margin-bottom:12px}.hand{width:112px;height:112px;border-radius:50%;margin:auto;background:#f5f2ec;border:1px solid var(--line);display:grid;place-items:center;font-size:55px;transition:transform .25s,background .25s}.hand.active{background:var(--mint);transform:scale(1.04)}.hand.shake{animation:shake .55s ease}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg) translateY(-4px)}45%{transform:rotate(15deg) translateY(3px)}70%{transform:rotate(-9deg)}}.vs{font-family:'DM Mono',monospace;color:#b6b2a8;font-size:12px;letter-spacing:.12em;text-align:center}.result{min-height:28px;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.02em}.result small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:3px}.result.win{color:var(--green)}.result.lose{color:#b36b43}.choices{display:flex;justify-content:center;gap:14px;margin:22px 0 0}.choice{width:95px;height:87px;background:#fffefa;border:1px solid var(--line);border-radius:13px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .18s,border-color .18s,background .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.choice:hover{transform:translateY(-4px);border-color:#91aa96;background:#fbfdf9}.choice:focus-visible,.reset:focus-visible{outline:3px solid #78a685;outline-offset:3px}.choice:active{transform:scale(.96)}.choice .emoji{font-size:27px;line-height:1}.choice span:last-child{font-size:11px;font-weight:700}.prompt{text-align:center;color:var(--muted);font-size:11px;margin:15px 0 0}.bottom{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em}.reset{border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;padding:7px 0}.reset:hover{color:var(--ink)}@media(max-width:560px){body{padding:20px 15px}.hero{padding:36px 0 25px}.arena{padding:22px 15px}.versus{grid-template-columns:1fr 55px 1fr}.hand{width:88px;height:88px;font-size:44px}.choices{gap:9px}.choice{width:82px;height:78px}.bottom{font-size:9px}.scoreboard{margin-bottom:23px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><span class="brand-mark">✳</span> THE HAND GAME</div><div class="bestof">3 rounds</div></header>
<section class="hero"><div class="eyebrow">A little friendly competition</div><h1>Rock Paper<br>Scissors.</h1><p>Choose your move. The computer has one too.</p></section>
<section class="scoreboard" aria-label="Score"><div class="score"><div class="label">You</div><div class="num" id="youScore">0</div></div><div class="divider"></div><div class="score"><div class="label">Computer</div><div class="num" id="cpuScore">0</div></div></section>
<section class="arena" aria-label="Game arena"><div class="arena-label"><span class="dot"></span><span id="roundLabel">Ready when you are</span></div><div class="versus"><div class="player"><div class="player-name">You</div><div class="hand" id="youHand" aria-label="Your move">✊</div></div><div class="vs">VS</div><div class="player"><div class="player-name">Computer</div><div class="hand" id="cpuHand" aria-label="Computer move">✊</div></div></div><div class="result" id="result" aria-live="polite">Make your move<small>Rock, paper, or scissors?</small></div><div class="choices" role="group" aria-label="Choose your move"><button class="choice" data-move="rock" aria-label="Choose rock"><span class="emoji">✊</span><span>Rock</span></button><button class="choice" data-move="paper" aria-label="Choose paper"><span class="emoji">✋</span><span>Paper</span></button><button class="choice" data-move="scissors" aria-label="Choose scissors"><span class="emoji">✌️</span><span>Scissors</span></button></div><p class="prompt" id="prompt">Pick one to play a round</p></section>
<footer class="bottom"><span>GOOD LUCK OUT THERE</span><button class="reset" id="reset">↺ &nbsp;Reset score</button></footer>
</main>
<script>
(()=>{const moves=['rock','paper','scissors'];const icons={rock:'✊',paper:'✋',scissors:'✌️'};let you=0,cpu=0,round=0,finished=false;const $=id=>document.getElementById(id);const youHand=$('youHand'),cpuHand=$('cpuHand'),result=$('result'),prompt=$('prompt'),roundLabel=$('roundLabel');function play(player){if(finished)return;round++;const computer=moves[Math.floor(Math.random()*moves.length)];youHand.classList.remove('shake','active');cpuHand.classList.remove('shake','active');void youHand.offsetWidth;youHand.classList.add('shake');cpuHand.classList.add('shake');youHand.textContent=icons[player];cpuHand.textContent=icons[computer];$('youScore').classList.remove('bump');$('cpuScore').classList.remove('bump');let outcome;if(player===computer){outcome='tie';result.className='result';result.innerHTML='It’s a tie<small>You both chose '+player+'.</small>'}else if((player==='rock'&&computer==='scissors')||(player==='paper'&&computer==='rock')||(player==='scissors'&&computer==='paper')){outcome='win';you++;$('youScore').textContent=you;$('youScore').classList.add('bump');result.className='result win';result.innerHTML='You win this round<small>'+cap(player)+' beats '+computer+'.</small>'}else{outcome='lose';cpu++;$('cpuScore').textContent=cpu;$('cpuScore').classList.add('bump');result.className='result lose';result.innerHTML='Computer wins this round<small>'+cap(computer)+' beats '+player+'.</small>'}roundLabel.textContent='Round '+round+' · '+(outcome==='tie'?'Draw':outcome==='win'?'Point for you':'Point for computer');youHand.classList.add('active');cpuHand.classList.add('active');if(round===3){finished=true;const champ=you>cpu?'You win the game!':cpu>you?'Computer wins the game!':'The game is a draw!';result.innerHTML=champ+'<small>Final score: '+you+' – '+cpu+'. Reset to play again.</small>';roundLabel.textContent='Game over · 3 rounds played';prompt.textContent='Reset the score to start a new game';document.querySelectorAll('.choice').forEach(b=>b.disabled=true)}else prompt.textContent='Choose again · '+(3-round)+' round'+(3-round===1?'':'s')+' left'}function cap(s){return s[0].toUpperCase()+s.slice(1)}document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>play(b.dataset.move)));$('reset').addEventListener('click',()=>{you=0;cpu=0;round=0;finished=false;$('youScore').textContent='0';$('cpuScore').textContent='0';youHand.textContent='✊';cpuHand.textContent='✊';youHand.classList.remove('active','shake');cpuHand.classList.remove('active','shake');result.className='result';result.innerHTML='Make your move<small>Rock, paper, or scissors?</small>';roundLabel.textContent='Ready when you are';prompt.textContent='Pick one to play a round';document.querySelectorAll('.choice').forEach(b=>b.disabled=false)})})();
</script>
</body>
</html>
